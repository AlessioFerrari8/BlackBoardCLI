[package]
name = "blackboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A shared chalkboard and chat for 2 people, right in the terminal"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29"
rand = "0.10"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"
