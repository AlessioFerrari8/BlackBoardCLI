[package]
name = "blackboard"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A shared chalkboard and chat for 2 people, right in the terminal"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29"
rand = "0.10"
ratatui = "0.30"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-width = "0.2.3"
